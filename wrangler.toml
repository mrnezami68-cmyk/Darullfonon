name = "darullfonon-api"
main = "worker/src/index.ts"
compatibility_date = "2026-09-02"
workers_dev = true

[vars]
# Secure-by-default. There is no Demo authorization path in any environment.
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "darullfonon"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "worker/migrations"
